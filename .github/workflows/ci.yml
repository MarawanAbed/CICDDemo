name: .NET CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Display .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore CICDDemo.sln

      - name: Build
        run: dotnet build CICDDemo.sln --configuration Release --no-restore

      - name: Run NUnit tests
        run: dotnet test CICDDemo.sln --configuration Release --no-build


      - name: Publish MVC application
        run: |
          dotnet publish CICDDemo/CICDDemo.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: CICDDemo-MVC
          path: ./publish